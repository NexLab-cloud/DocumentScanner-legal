<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="index, follow" />
<title>AI Document Scanner — Legal Documents</title>
<style>
  :root {
    --indigo: #4F46E5;
    --violet: #8B5CF6;
    --deep: #1E1B4B;
    --gold: #F59E0B;
    --ink: #1a1a2e;
    --muted: #5b6169;
    --line: #e6e8ef;
    --card: #f8f8fc;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--indigo) 0%, var(--violet) 55%, var(--deep) 100%);
    background-size: 240% 240%;
    animation: drift 16s ease-in-out infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  @keyframes drift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Soft floating orbs — decorative only, CSS animation, no JS anywhere on
     this page so nothing about it can ever break or throw a console error
     on a document that exists to be trustworthy. */
  .blob { position: fixed; border-radius: 50%; filter: blur(46px); opacity: 0.16; background: #ffffff; pointer-events: none; z-index: 0; }
  .blob1 { width: 280px; height: 280px; top: -70px; left: -70px; animation: float1 10s ease-in-out infinite; }
  .blob2 { width: 220px; height: 220px; bottom: -50px; right: -50px; animation: float2 12s ease-in-out infinite; background: var(--gold); opacity: 0.14; }
  .blob3 { width: 150px; height: 150px; top: 42%; right: 6%; animation: float1 8s ease-in-out infinite; }
  .blob4 { width: 110px; height: 110px; bottom: 30%; left: 4%; animation: float2 9.5s ease-in-out infinite; }
  @keyframes float1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(26px, 32px); } }
  @keyframes float2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-22px, -28px); } }

  .wrap { position: relative; z-index: 1; width: 100%; max-width: 580px; padding: 60px 20px 60px; display: flex; flex-direction: column; align-items: center; text-align: center; }

  /* Icon — a scanned document with an AI sparkle, built in CSS/SVG rather
     than a raster image, so there's no external file to go missing. */
  /* App icon — the real one, sized down from source and embedded so
     there's no external file to go missing. It already has its own
     rich blue-to-teal gradient baked in, so it's framed as a clean
     rounded-square app-icon tile rather than sat inside a separate
     frosted box, which would just compete with it. */
  .icon {
    width: 92px; height: 92px; border-radius: 22px;
    overflow: hidden;
    margin-bottom: 22px; opacity: 0;
    box-shadow: 0 10px 32px rgba(0,0,0,0.28), 0 2px 8px rgba(0,0,0,0.15);
    animation: pop 0.65s cubic-bezier(0.2, 0.9, 0.3, 1.35) 0.1s forwards,
               bob 3.4s ease-in-out 0.9s infinite;
  }
  .icon img { width: 100%; height: 100%; display: block; object-fit: cover; }
  @keyframes pop { from { opacity: 0; transform: scale(0.55) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  h1 { color: #fff; font-size: 27px; font-weight: 800; margin: 0 0 6px; opacity: 0; animation: fadeUp 0.6s ease 0.25s forwards; letter-spacing: -0.3px; }
  .tagline { color: rgba(255,255,255,0.86); font-size: 14px; margin: 0 0 38px; opacity: 0; animation: fadeUp 0.6s ease 0.35s forwards; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* Each card is a single clickable row — icon, title, one-line
     description, chevron. With no Arabic split to show yet, this reads
     cleaner than a row of language pills with only one pill in it. */
  .doc-link {
    width: 100%;
    display: flex; align-items: center; gap: 16px;
    background: var(--card);
    border-radius: 18px;
    padding: 18px 20px;
    margin-bottom: 14px;
    text-decoration: none;
    box-shadow: 0 16px 38px rgba(20, 10, 60, 0.22);
    opacity: 0; transform: translateY(18px);
    animation: fadeUp 0.55s ease forwards;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    border: 1.5px solid transparent;
  }
  .doc-link:nth-of-type(1) { animation-delay: 0.48s; }
  .doc-link:nth-of-type(2) { animation-delay: 0.6s; }
  .doc-link:hover { transform: translateY(-3px); box-shadow: 0 22px 48px rgba(20, 10, 60, 0.3); border-color: rgba(79, 70, 229, 0.25); }
  .doc-link:active { transform: translateY(-1px); }

  .doc-icon {
    flex-shrink: 0; width: 46px; height: 46px; border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--indigo), var(--violet));
  }
  .doc-icon svg { width: 24px; height: 24px; stroke: #fff; }

  .doc-text { flex: 1; text-align: left; }
  .doc-text h2 { font-size: 16px; margin: 0 0 2px; color: var(--ink); font-weight: 700; }
  .doc-text p { font-size: 12.5px; margin: 0; color: var(--muted); }

  .chevron { flex-shrink: 0; color: var(--indigo); opacity: 0.55; transition: transform 0.18s ease, opacity 0.18s ease; }
  .doc-link:hover .chevron { transform: translateX(3px); opacity: 1; }

  .meta-row {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    margin-top: 6px; padding: 0 4px;
    opacity: 0; animation: fadeUp 0.55s ease 0.72s forwards;
  }
  .badge {
    font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.14); padding: 4px 10px; border-radius: 20px;
    letter-spacing: 0.3px;
  }

  footer {
    position: relative; z-index: 1; color: rgba(255,255,255,0.72); font-size: 12.5px;
    padding: 10px 20px 32px; text-align: center;
    opacity: 0; animation: fadeUp 0.6s ease 0.85s forwards;
  }
  footer a { color: #fff; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.35); }
  footer a:hover { border-bottom-color: #fff; }
  footer .brand { display: block; margin-top: 4px; font-weight: 600; letter-spacing: 0.3px; }
</style>
</head>
